name: Atualizar indicadores da página de vendas

on:
  schedule:
    # Dias úteis: 9h17 e 18h47 (Brasília). Pega o CDI/Selic do dia e o fechamento da Bolsa.
    - cron: '17 12 * * 1-5'
    - cron: '47 21 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/atualizar_indicadores.mjs'
      - '.github/workflows/indicadores.yml'

permissions:
  contents: write

concurrency:
  group: indicadores
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Buscar indicadores
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
        run: node scripts/atualizar_indicadores.mjs
      - name: Salvar se mudou
        run: |
          if git diff --quiet vendas/indicadores.json; then
            echo "Nada mudou."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git add vendas/indicadores.json
            git commit -m "Atualiza indicadores (Selic, CDI, IPCA, Ibovespa)"
            git pull --rebase
            git push
          fi
