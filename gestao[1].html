<!doctype html>
<html lang="pt-BR" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Gestão Casal das Cifras</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: cabeçalho fixo com abas, painel de indicadores, tabelas de cobrança e atendimento por contrato */
:root{
  --bg:#F6EFE3;--surface:#FFFBF4;--ink:#2A1C10;--muted:#7A6652;--line:#E5D8C4;
  --brand:#5C3B1E;--amber:#E39A1F;--ok:#0F8F7B;--warn:#B7791F;--bad:#B3361B;--blue:#5B63C9;
  --okbg:#DDF1EC;--warnbg:#FBEBC8;--badbg:#F8DDD5;--bluebg:#E4E6F8;
  --f-display:'Cormorant Garamond',Georgia,serif;--f-body:'Hanken Grotesk',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);padding-block:0 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;padding:22px 0 10px}
.brand{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.logo{height:76px;width:auto;max-width:100%;border-radius:10px;background:#EFEDE9}
h1{font:700 30px/1 var(--f-display);color:var(--brand);margin:0;letter-spacing:.2px}
.sub{color:var(--muted);font-size:13px}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:600 14px var(--f-body);padding:12px 14px;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{color:var(--brand);border-bottom-color:var(--amber)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
main{padding-top:20px;display:grid;gap:20px}
h2{font:600 22px/1.1 var(--f-display);margin:0 0 10px;color:var(--brand)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font:600 28px/1.1 var(--f-display);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .n{font-size:12px;color:var(--muted);margin-top:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.p-ok{background:var(--okbg);color:var(--ok)}.p-warn{background:var(--warnbg);color:var(--warn)}
.p-bad{background:var(--badbg);color:var(--bad)}.p-blue{background:var(--bluebg);color:var(--blue)}.p-mut{background:var(--line);color:var(--muted)}
.btn{background:var(--brand);color:var(--bg);border:0;border-radius:8px;padding:9px 14px;font:600 13px var(--f-body);cursor:pointer}
.btn.sec{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.del{background:transparent;color:var(--bad);border:1px solid var(--bad)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
label{display:grid;gap:3px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
input,select,textarea{font:15px var(--f-body);padding:8px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
.full{grid-column:1/-1}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px}
.flag{background:var(--warnbg);color:var(--warn);border-radius:7px;padding:7px 10px;font-size:13px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--amber)}
.empty{color:var(--muted);padding:18px;text-align:center;font-size:14px}
.split{display:grid;gap:8px}.split div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:6px;font-variant-numeric:tabular-nums}
.leg{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}.leg b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
svg text{fill:var(--muted);font:11px var(--f-body)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--brand);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20}
:root,:root[data-theme="light"]{color-scheme:light;--bg:#FCFAF6;--surface:#FFFFFF;--ink:#3D2B1F;--muted:#8B7355;--line:#EBE3D4;--brand:#3D2B1F;--amber:#C9891A;--ok:#4A7C59;--warn:#8A5A0B;--bad:#8B3A3A;--blue:#6B4C35;--okbg:#E4EBDF;--warnbg:#F5E8CC;--badbg:#F1E0DB;--bluebg:#EDE5D8;--f-body:'Manrope','Helvetica Neue',Arial,sans-serif;--f-caps:'Cinzel',Georgia,serif}
body{background:radial-gradient(900px 480px at 10% -10%,#FFFFFF 0%,transparent 65%),radial-gradient(700px 400px at 100% 0%,#F8F1E3 0%,transparent 60%),var(--bg)}
header{padding:22px 0 14px;border-bottom:1px solid var(--line);margin-bottom:6px;position:relative}
header::after{content:"";position:absolute;left:0;bottom:-1px;width:64px;height:2px;background:var(--amber)}
.logo{height:58px;border-radius:0;background:none}
nav button{font-family:var(--f-caps);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase}
.kpi .l,th,.lbl{font-family:var(--f-caps);font-weight:500;letter-spacing:.14em}
.kpi,.panel{border-radius:10px;box-shadow:0 14px 32px -24px rgba(61,43,31,.45)}
.pill{border-radius:3px}
.btn.pri,button.pri{background:var(--brand);color:var(--bg);border-color:var(--brand);box-shadow:inset 0 -3px 0 var(--amber)}
.fxc{display:flex;gap:10px;align-items:flex-end;height:230px;padding:10px 0 0;margin-top:10px}
.fxm{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end}
.fxs{position:relative;width:100%;flex:1;display:flex;align-items:flex-end;justify-content:center}
.fxb{width:62%;max-width:54px;height:100%;display:flex;flex-direction:column-reverse;justify-content:flex-start}
.fxb i{display:block;width:100%}
.fxd{position:absolute;left:0;right:0;border-top:2px dashed var(--brand);opacity:.6}
.fxm b{font-size:11.5px;white-space:nowrap}.fxm span{font:500 11px var(--f-caps);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lg{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 12px;vertical-align:middle}
@media(max-width:560px){.fxm b{font-size:9.5px}}
.chk{display:flex!important;flex-direction:row!important;gap:8px;align-items:center;text-transform:none!important;letter-spacing:0!important;font:500 13px var(--f-body)!important}.chk input{width:auto}
a{color:var(--amber)}a.btn{text-decoration:none;display:inline-block;color:var(--bg)}a.btn.sec{color:var(--brand)}
</style>

<script>
(function(){
'use strict';
var DB=null,S={tab:'painel',contracts:[],sessions:[],payments:[],expenses:[],cfg:null,edit:null,imp:null,ready:false,denied:false};
var DEF={fine:10,interest:1,split:[{n:'Despesas da empresa',p:20},{n:'Reserva',p:20},{n:'Pró-labore Thalita',p:15},{n:'Pró-labore Bruna',p:15}]};
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var brl=function(v){return (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})};
var pad=function(n){return (n<10?'0':'')+n};
var iso=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var TODAY=iso(new Date());
var fdate=function(s){if(!s)return '—';var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]};
var MN=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},2600)}
function cfg(){return S.cfg||DEF}
function addMonths(ymd,n,day){var p=ymd.split('-').map(Number);var d=new Date(p[0],p[1]-1+n,1);var last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return iso(new Date(d.getFullYear(),d.getMonth(),Math.min(day||p[2],last)))}
function daysBetween(a,b){return Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5)}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}

/* Cobranças: parcelas geradas pelo contrato; pagamentos quitam as mais antigas primeiro */
function receivables(hz){
  var out=[],horizon=hz||addMonths(TODAY,1,28);
  S.contracts.forEach(function(c){
    if(c.status==='encerrado'||!c.firstDue||!c.value)return;
    var day=c.dueDay||10,list=[],n=0;
    while(n<(c.installments||120)){var due=addMonths(c.firstDue,n,day);if(due>horizon)break;list.push({c:c,n:n+1,due:due,value:c.value,paid:0});n++}
    var pool=S.payments.filter(function(p){return p.contractId===c.id}).reduce(function(a,p){return a+(p.amount||0)},0);
    list.forEach(function(r){var use=Math.min(pool,r.value);r.paid=use;pool-=use;
      r.open=r.value-r.paid;
      r.status=r.open<=0.005?'pago':(r.due<TODAY?'vencido':'a vencer');
      if(r.status==='vencido'){var d=daysBetween(r.due,TODAY);r.days=d;r.fine=r.open*cfg().fine/100;r.interest=r.open*(cfg().interest/100)*(d/30);r.total=r.open+r.fine+r.interest}
      out.push(r)});
  });
  return out.sort(function(a,b){return a.due<b.due?-1:1});
}
function sessCount(c){return S.sessions.filter(function(s){return s.contractId===c.id&&s.status==='realizado'}).length}
function cname(id){var c=S.contracts.find(function(x){return x.id===id});return c?c.clientName:'(removido)'}

/* ---------- persistência ---------- */
function newId(col){return DB.collection(col).doc().id}
function save(col,id,data){return DB.doc(col+'/'+id).set(data).catch(function(e){toast('Não salvou: '+(e&&e.message||e))})}
function del(col,id){return DB.doc(col+'/'+id).delete().catch(function(e){toast('Não removeu: '+(e&&e.message||e))})}
function clean(o){var r={};Object.keys(o).forEach(function(k){if(k!=='id')r[k]=o[k]});return r}
function sub(col,key){return DB.collection(col).onSnapshot(function(snap){S[key]=snap.docs.map(function(d){var x=Object.assign({},d.data());x.id=d.id;return x});S.ready=true;render()},function(){S.denied=true;render()})}

/* ---------- views ---------- */
function pill(st){var m={'pago':'p-ok','a vencer':'p-blue','vencido':'p-bad','realizado':'p-ok','agendado':'p-blue','cancelado':'p-mut','ativo':'p-ok','encerrado':'p-mut'};return '<span class="pill '+(m[st]||'p-mut')+'">'+esc(st)+'</span>'}
function monthKey(ymd){return ymd.slice(0,7)}
function render(){
  $('#today').textContent='Hoje: '+fdate(TODAY);
  var v=$('#view');
  if(!DB){v.innerHTML='<div class="empty">Abra a página conectada à sua conta para ver os dados.</div>';return}
  if(S.denied){v.innerHTML='<div class="empty">Esta página é privada. Entre com a conta O Casal das Cifras.</div>';return}
  var f={painel:vPainel,contratos:vContratos,atend:vAtend,receb:vReceb,fluxo:vFluxo,agenda:vAgenda,ajustes:vAjustes}[S.tab];
  var keep=document.activeElement&&document.activeElement.id;
  v.innerHTML=f();
  if(keep){var el=document.getElementById(keep);if(el&&el.focus&&/INPUT|TEXTAREA|SELECT/.test(el.tagName)){}}
}
var PAL=['var(--brand)','var(--amber)','var(--ok)','var(--blue)','var(--bad)','var(--warn)','var(--muted)'];
function monthsRange(back,fwd){var b=new Date(),o=[];for(var i=-back;i<=fwd;i++){var d=new Date(b.getFullYear(),b.getMonth()+i,1);o.push(d.getFullYear()+'-'+pad(d.getMonth()+1))}return o}
function recIn(m){return S.payments.filter(function(p){return monthKey(p.date)===m}).reduce(function(a,p){return a+p.amount},0)}
function expIn(m){return S.expenses.filter(function(p){return monthKey(p.date)===m}).reduce(function(a,p){return a+p.amount},0)}
function lastDay(c,arr){var l=arr.filter(function(s){return s.contractId===c.id}).map(function(s){return s.date}).sort();return l.length?l[l.length-1]:null}
function vPainel(){
  var R=receivables(),mk=monthKey(TODAY),yr=TODAY.slice(0,4),sp=cfg().split;
  var exp=R.filter(function(r){return monthKey(r.due)===mk}).reduce(function(a,r){return a+r.value},0);
  var rec=recIn(mk),dsp=expIn(mk);
  var recY=S.payments.filter(function(p){return p.date.slice(0,4)===yr}).reduce(function(a,p){return a+p.amount},0);
  var late=R.filter(function(r){return r.status==='vencido'});
  var lateV=late.reduce(function(a,r){return a+r.open},0);
  var venc=R.filter(function(r){return r.due<TODAY}).reduce(function(a,r){return a+r.value},0);
  var pagoVenc=R.filter(function(r){return r.due<TODAY}).reduce(function(a,r){return a+r.paid},0);
  var adim=venc?Math.round(pagoVenc/venc*100):100;
  var act=S.contracts.filter(function(c){return c.status!=='encerrado'});
  var mrr=act.reduce(function(a,c){return a+(c.value||0)},0);
  var missing=act.filter(function(c){return !c.value||!c.firstDue});
  var done=S.sessions.filter(function(s){return s.status==='realizado'});
  var sessM=done.filter(function(s){return monthKey(s.date)===mk}).length;
  var totRec=S.payments.reduce(function(a,p){return a+p.amount},0);
  var perSess=done.length?totRec/done.length:0;
  var h='';
  if(missing.length)h+='<div class="flag"><b>Falta preencher o contrato de '+missing.map(function(c){return esc(c.clientName)}).join(' e ')+'.</b> Sem valor e primeiro vencimento a cobrança não é gerada.</div>';
  var al=alerts(R,act);
  if(al.length)h+='<div class="panel"><h2>Atenção agora</h2><div class="split">'+al.map(function(a){return '<div><span>'+a.t+'</span><span class="pill '+a.c+'">'+a.l+'</span></div>'}).join('')+'</div></div>';
  h+='<div class="kpis">'+
   k('Receita recorrente',brl(mrr),act.length+' contrato(s) ativo(s)')+
   k('Recebido no mês',brl(rec),exp?Math.round(rec/exp*100)+'% do previsto ('+brl(exp)+')':'sem vencimento no mês')+
   k('Em atraso',brl(lateV),late.length?late.length+' parcela(s)':'nenhuma parcela')+
   k('Adimplência',adim+'%','vencido até hoje x pago')+
   k('Recebido em '+yr,brl(recY),'acumulado do ano')+
   k('Resultado do mês',brl(rec-dsp),'recebido − despesas ('+brl(dsp)+')')+
   k('Atendimentos',done.length,sessM+' no mês')+
   k('Receita por atendimento',brl(perSess),'recebido ÷ atendimentos')+'</div>';
  h+='<div class="grid2"><div class="panel"><h2>Previsto x recebido</h2>'+chart(R)+'<div class="leg"><span><b style="background:var(--line)"></b>Previsto</span><span><b style="background:var(--ok)"></b>Recebido</span></div></div>'+
   '<div class="panel"><h2>Receita acumulada</h2>'+lineAcc()+'</div>'+
   '<div class="panel"><h2>Atendimentos por mês</h2>'+sessChart()+'<div class="leg">'+act.map(function(c,i){return '<span><b style="background:'+PAL[i%PAL.length]+'"></b>'+esc(c.clientName.split(' ')[0])+'</span>'}).join('')+'</div></div>'+

function readImp(txt){
  var out=[],seen={};
  txt.split(/\r?\n/).forEach(function(line){
    var m=line.match(/(\d{2})\/(\d{2})\/(\d{4})/);if(!m)return;
    var parts=line.split(/;|\t/);if(parts.length<3)parts=line.split(',');
    var amt=null,desc=[];
    parts.forEach(function(p,i){var t=p.trim();if(/^-?R?\$?\s?-?\d{1,3}(\.\d{3})*,\d{2}$/.test(t)||/^-?\d+,\d{2}$/.test(t)){if(amt===null&&i>0)amt=parseFloat(t.replace(/[R$\s.]/g,'').replace(',','.'))}else if(!/^\d{2}\/\d{2}\/\d{4}$/.test(t)&&t)desc.push(t)});
    if(amt===null||amt<=0)return;
    var date=m[3]+'-'+m[2]+'-'+m[1],d=desc.join(' · ');
    var cid='',nd=norm(d);
    S.contracts.forEach(function(c){var toks=norm(c.clientName).split(/\s+/).filter(function(t){return t.length>2});if(toks.length&&toks.filter(function(t){return nd.indexOf(t)>=0}).length>=Math.min(2,toks.length))cid=c.id});
    var dup=cid&&S.payments.some(function(p){return p.contractId===cid&&p.date===date&&Math.round(p.amount*100)===Math.round(amt*100)});
    out.push({date:date,desc:d,amount:amt,cid:cid,dup:!!dup,use:!!cid&&!dup});
  });
  return out;
}

    var inner=!id?'<span class="sub">Sem pasta vinculada: cole o link em Contratos → Editar.</span>':
      '<a class="btn sm" href="'+drvLink(id)+'" target="_blank" rel="noopener">Abrir pasta</a>'+
      (!mcpOk()?'':(!f||f.loading)?'<div class="sub" style="margin-top:6px">Carregando arquivos…</div>':f.err?'<div class="sub">'+esc(f.err)+'</div>':
        (f.list.length?'<div style="margin-top:8px"></div>'+f.list.map(function(x){var fo=x.mimeType==='application/vnd.google-apps.folder';return '<div class="row sub"><a href="'+esc(x.viewUrl)+'" target="_blank" rel="noopener">'+(fo?'📁 ':'📄 ')+esc(x.title)+'</a><span>'+fdate((x.modifiedTime||'').slice(0,10))+'</span></div>'}).join(''):'<div class="sub">Pasta vazia.</div>'));
    return '<div style="padding:10px 0;border-top:1px solid var(--line)"><b>'+esc(c.clientName)+'</b><div style="margin-top:6px">'+inner+'</div></div>'}).join('')+'</div></div>';
  return h;
}

(async function boot(){
  try{
    var cl=window.claude;if(!cl){render();return}
    DB=await cl.use('db');
    if(!DB){render();return}
    if(window.CC_ROLE!=='admin'){S.denied=true;render();return}
    sub('contracts','contracts');sub('sessions','sessions');sub('payments','payments');sub('expenses','expenses');
    DB.doc('settings/main').onSnapshot(function(s){S.cfg=s.exists?s.data():null;render()},function(){});
  }catch(err){console.error(err);render()}
})();
render();
})();
</script>
